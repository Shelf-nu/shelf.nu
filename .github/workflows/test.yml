name: 🧪 Test

# SECURITY INVARIANT — read this before adding a job to this workflow.
#
# This workflow runs on `pull_request`, so fork PRs execute here. GitHub gives
# those runs a read-only GITHUB_TOKEN and NO repository secrets — that is
# precisely what makes it safe to run untrusted contributor code automatically.
#
# Therefore: any job that consumes a secret MUST NOT live in this workflow.
# Secret-bearing jobs (e.g. an end-to-end suite) belong in a separate
# workflow gated behind the `external` environment, and must never check out
# fork PR code in that trusted context.
#
# Do NOT "fix" a fork PR checkout failure by setting `allow-unsafe-pr-checkout:
# true` on a checkout step. That re-enables the "pwn request" attack class that
# actions/checkout began blocking in July 2026.

on:
  pull_request:
  # Manual run from the Actions tab. `run_benchmarks` adds the opt-in booking
  # sources benchmark to the Database tests job (see that job). Only people
  # with write access can dispatch, and the run uses no secrets.
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run the booking sources benchmark in the Database tests job
        type: boolean
        default: false
  # Called by deploy.yml on pushes to main/dev. It passes no secrets: no job
  # here needs one (see the SECURITY INVARIANT above).
  workflow_call:

# Least privilege, pinned explicitly. The repo default is already `read`, but
# pinning it means a future org-level default change cannot silently escalate
# these jobs. `contents: read` is what actions/checkout needs to fetch.
permissions:
  contents: read

concurrency:
  # PR number for PR runs; run_id on the workflow_call path so a push to main
  # gets a unique group and can never be cancelled by a PR run. Note that in a
  # reusable workflow the `github` context belongs to the CALLER.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          # No `ref:` — the default checkout resolves to the PR merge ref and is
          # exempt from actions/checkout's fork-PR guard. No credentials
          # persisted: nothing after this step needs git auth, so the token
          # never lands in .git/config where fork code could read it.
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🔬 Lint
        run: pnpm run lint

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🔎 Type check
        run: pnpm run typecheck

  # The webapp suite is split across parallel runners. Its cost is per-file
  # module loading (each file gets a fresh worker that re-imports its whole
  # graph), not test bodies, so it scales with runner count, not with tuning.
  # Keep the shard count in `matrix.shard` and `--shard=…/N` in step with each
  # other.
  vitest-shard:
    name: ⚡ Vitest (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish so one failure does not hide failures elsewhere.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # A full install, not `--filter "@shelf/webapp..."`: webapp tests import
      # companion source (e.g. test/mobile/qr-utils.test.ts), and Vite reads
      # the companion's tsconfig, which extends an Expo base. With the pnpm
      # cache warm the full install takes seconds anyway.
      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile
        env:
          # The next step generates the client from the real schema path;
          # Prisma's own postinstall cannot find it and would only warn.
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      - name: 🔧 Generate Prisma client
        run: pnpm --filter @shelf/database run db:generate

      - name: ⚡ Run vitest
        run: pnpm --filter @shelf/webapp test -- --run --shard=${{ matrix.shard }}/4

  # Suites the webapp vitest run does not reach. They are small, so they share
  # one job, running beside the shards rather than after them.
  workspace-tests:
    name: 🧩 Package & companion tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      # @shelf/database's own tests import the generated client.
      - name: 🔧 Generate Prisma client
        run: pnpm --filter @shelf/database run db:generate

      # Workspace packages run their own suites (node:test); this step is the
      # only place CI runs a package's `test` script. NOT `turbo run test`:
      # turbo.json marks that task persistent (vitest watch mode), so it would
      # hang the job.
      - name: 🧩 Run workspace package tests
        run: pnpm -r --filter "./packages/*" run test

      # The companion's suite is node:test via tsx. Its `lib/**` tests are pure
      # and take under a second — no simulator, no database.
      - name: 📱 Run companion tests
        run: pnpm --filter @shelf/companion test

  # Tests that need a real, migrated PostgreSQL (`*.db.test.ts`): deferred
  # constraint triggers, grants and anything else the mocked suite cannot see.
  # The database is a throwaway service container, so no secret is involved
  # and the job stays safe for fork PRs (see the SECURITY INVARIANT above).
  # The harness creates the `anon`/`authenticated` roles plain Postgres lacks.
  #
  # The booking sources benchmark is off by default. It runs when the workflow
  # is dispatched with `run_benchmarks`, or on a PR that carries the
  # `run-benchmarks` label (read from the event, so it applies from the next
  # push after the label is added). It needs no secret either, so the job
  # stays fork-safe; on a fork PR only a maintainer can add the label.
  db-tests:
    name: 🗄️ Database tests
    runs-on: ubuntu-latest
    # 20 minutes for the main suite, plus the benchmark step's 80 when it runs.
    timeout-minutes: ${{ (inputs.run_benchmarks || contains(github.event.pull_request.labels.*.name, 'run-benchmarks')) && 100 || 20 }}
    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The harness refuses any database whose name does not end in _test.
          POSTGRES_DB: shelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shelf_test
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      - name: 🔧 Generate Prisma client
        run: pnpm --filter @shelf/database run db:generate

      # Global setup migrates the service database, then the suite runs.
      - name: 🗄️ Run database tests
        run: pnpm webapp:test:db

      # Builds two large fixtures and times each booking operation on LEGACY
      # data with adoption off against converted data with adoption on, then
      # prints EXPLAIN (ANALYZE, BUFFERS) plans. Skipped by the step above,
      # which runs without RUN_BENCHMARKS.
      - name: ⏱️ Run booking sources benchmark
        if: ${{ inputs.run_benchmarks || contains(github.event.pull_request.labels.*.name, 'run-benchmarks') }}
        # The sum of the benchmark's hook and test timeouts (BUILD_TIMEOUT_MS
        # and its siblings in the test file). Change them together.
        timeout-minutes: 80
        env:
          RUN_BENCHMARKS: "1"
        run: >-
          pnpm --filter @shelf/webapp exec vitest --run
          --config vitest.db.config.ts
          test/db/booking-sources-benchmark.db.test.ts

  # One stable check that reports the combined result of every shard, so the
  # check name does not change when the shard count does. `always()` makes it
  # run — and fail — when a shard fails, instead of being skipped (a skipped
  # check reads as passing).
  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    needs: vitest-shard
    if: always()
    steps:
      - name: ✅ All shards passed
        env:
          SHARDS_RESULT: ${{ needs.vitest-shard.result }}
        run: |
          echo "Vitest shards: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = "success"

  tooling:
    name: 🛠️ PR review tooling
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Run watchdog bash suite
        run: pnpm test:tooling
