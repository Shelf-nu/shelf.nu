name: 🧪 Test

# SECURITY INVARIANT — read this before adding a job to this workflow.
#
# This workflow runs on `pull_request`, so fork PRs execute here. GitHub gives
# those runs a read-only GITHUB_TOKEN and NO repository secrets — that is
# precisely what makes it safe to run untrusted contributor code automatically.
#
# Therefore: any job that consumes a secret MUST NOT live in this workflow.
# Secret-bearing jobs (e.g. the Playwright/E2E suite below) belong in a separate
# workflow gated behind the `external` environment, and must never check out
# fork PR code in that trusted context.
#
# Do NOT "fix" a fork PR checkout failure by setting `allow-unsafe-pr-checkout:
# true` on a checkout step. That re-enables the "pwn request" attack class that
# actions/checkout began blocking in July 2026.

on:
  pull_request:
  # Called by deploy.yml on pushes to main/dev. The secrets below are declared
  # for the E2E job that currently lives commented-out at the bottom of this
  # file; deploy.yml passes all six, so this block must not be removed.
  workflow_call:
    secrets:
      SESSION_SECRET:
        required: true
      SUPABASE_ANON_PUBLIC:
        required: true
      SUPABASE_SERVICE_ROLE:
        required: true
      SUPABASE_URL:
        required: true
      SERVER_URL:
        required: true
      DATABASE_URL:
        required: true

# Least privilege, pinned explicitly. The repo default is already `read`, but
# pinning it means a future org-level default change cannot silently escalate
# these jobs. `contents: read` is what actions/checkout needs to fetch.
permissions:
  contents: read

concurrency:
  # PR number for PR runs; run_id on the workflow_call path so a push to main
  # gets a unique group and can never be cancelled by a PR run. Note that in a
  # reusable workflow the `github` context belongs to the CALLER.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          # No `ref:` — the default checkout resolves to the PR merge ref and is
          # exempt from actions/checkout's fork-PR guard. No credentials
          # persisted: nothing after this step needs git auth, so the token
          # never lands in .git/config where fork code could read it.
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🔬 Lint
        run: pnpm run lint

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🔎 Type check
        run: pnpm run typecheck

  # The webapp suite is split across parallel runners. Its cost is per-file
  # module loading (each file gets a fresh worker that re-imports its whole
  # graph), not test bodies, so it scales with runner count, not with tuning.
  # Keep the shard count in `matrix.shard` and `--shard=…/N` in step with each
  # other.
  vitest-shard:
    name: ⚡ Vitest (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish so one failure does not hide failures elsewhere.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A full install, not `--filter "@shelf/webapp..."`: webapp tests import
      # companion source (e.g. test/mobile/qr-utils.test.ts), and Vite reads
      # the companion's tsconfig, which extends an Expo base. With the pnpm
      # cache warm the full install takes seconds anyway.
      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile
        env:
          # The next step generates the client from the real schema path;
          # Prisma's own postinstall cannot find it and would only warn.
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      - name: 🔧 Generate Prisma client
        run: pnpm --filter @shelf/database run db:generate

      - name: ⚡ Run vitest
        run: pnpm --filter @shelf/webapp test -- --run --shard=${{ matrix.shard }}/4

  # Suites the webapp vitest run does not reach. They are small, so they share
  # one job, running beside the shards rather than after them.
  workspace-tests:
    name: 🧩 Package & companion tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      # @shelf/database's own tests import the generated client.
      - name: 🔧 Generate Prisma client
        run: pnpm --filter @shelf/database run db:generate

      # Workspace packages run their own suites (node:test); this step is the
      # only place CI runs a package's `test` script. NOT `turbo run test`:
      # turbo.json marks that task persistent (vitest watch mode), so it would
      # hang the job.
      - name: 🧩 Run workspace package tests
        run: pnpm -r --filter "./packages/*" run test

      # The companion's suite is node:test via tsx. Its `lib/**` tests are pure
      # and take under a second — no simulator, no database.
      - name: 📱 Run companion tests
        run: pnpm --filter @shelf/companion test

  # One stable check that reports the combined result of every shard, so the
  # check name does not change when the shard count does. `always()` makes it
  # run — and fail — when a shard fails, instead of being skipped (a skipped
  # check reads as passing).
  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    needs: vitest-shard
    if: always()
    steps:
      - name: ✅ All shards passed
        env:
          SHARDS_RESULT: ${{ needs.vitest-shard.result }}
        run: |
          echo "Vitest shards: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = "success"

  tooling:
    name: 🛠️ PR review tooling
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🛠️ Run pr-review-loop bash suite
        run: pnpm test:tooling

  # NOTE: this job consumes secrets — see the SECURITY INVARIANT at the top of
  # this file. Do NOT re-enable it here. It belongs in its own workflow gated
  # behind the `external` environment, and must not check out fork PR code.
