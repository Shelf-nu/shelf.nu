# Check a booking out and answer "Where do the units come from?" for a pool
# kept at two or more locations (PR: feat/companion-custody-source-location).
#
# Precondition: app foregrounded with a signed-in session (qa-admin1 /
# GRANULAR WORKSPACE): the no-login pattern, so NO launchApp/clearState.
# Test data: a RESERVED booking named BOOKING_NAME holding a QUANTITY_TRACKED
# asset placed at TWO locations (one of them SOURCE_LOCATION) with enough left
# at both. The flow checks the booking out from SOURCE_LOCATION and expects the
# booking row to say where the units left from. It leaves the booking ONGOING;
# the caller checks it in (or deletes the fixture) afterwards.
#
# Maestro full-matches a11y labels, so text matchers are regex-wrapped.
appId: com.shelf.companion.carlos
env:
  BOOKING_NAME: "ZZQ phone checkout source"
  POOL_TITLE: "ZZQ phone spanner"
  SOURCE_LOCATION: "Studio"
---
- tapOn: "Bookings"
- extendedWaitUntil:
    visible: "Booking: ${BOOKING_NAME}.*"
    timeout: 15000
- tapOn: "Booking: ${BOOKING_NAME}.*"
- extendedWaitUntil:
    visible: ".*Check Out All Assets.*"
    timeout: 15000
- tapOn: ".*Check Out All Assets.*"
# Native confirm, then the question sheet.
- tapOn: "^Check Out$"
- extendedWaitUntil:
    visible: "Where do the units come from?"
    timeout: 15000
- tapOn: "${POOL_TITLE}.* from ${SOURCE_LOCATION}.*"
- tapOn: "^Check out$"
- extendedWaitUntil:
    visible: "Checked Out"
    timeout: 20000
- tapOn: "OK"
- extendedWaitUntil:
    visible: ".*from ${SOURCE_LOCATION}.*"
    timeout: 20000
