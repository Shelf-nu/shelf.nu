# Temporary, for this PR only: the refactor touches more files than CodeRabbit
# reviews at once, so the review runs in batches. Delete this file before merge.
#
# Batch 3 of 3: tests (unit, component, route and characterization tests, and
# the shared test helpers), snapshots excluded.
reviews:
  path_filters:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.test.cjs"
    - "apps/webapp/test/**"
    - "!**/__snapshots__/**"
